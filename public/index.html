<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culto Stories</title>
<style>
  @font-face { font-family: 'Cossette Titre'; src: url(fonts/CossetteTitre.ttf) format('truetype'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Cossette Titre'; src: url(fonts/CossetteTitre-Bold.ttf) format('truetype'); font-weight: 700; font-display: block; }
</style>
<style>
  :root { --bg: #0e0e0f; --panel: #17171a; --line: #2a2a2f; --text: #ececec; --muted: #8a8a92; --accent: #d11a1a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 24px; padding: 24px; min-height: 100vh; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
  h1 { font: 28px 'Cossette Titre', sans-serif; margin: 0; letter-spacing: .5px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { min-width: 0; width: 100%; }
  input, select, button { font: inherit; color: var(--text); background: #0f0f11; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; padding: 12px; }
  button:disabled { opacity: .5; cursor: wait; }
  .tabs { display: flex; gap: 4px; }
  .tabs button[aria-pressed="true"] { border-color: var(--text); }
  #results { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; display: grid; gap: 4px; }
  #results button { width: 100%; text-align: left; display: grid; gap: 2px; }
  #results small { color: var(--muted); }
  #status { min-height: 1.4em; font-size: 12px; color: var(--muted); }
  #status.err { color: #ff6b6b; }
  .drop { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.has { color: var(--text); border-style: solid; }
  .stage { position: sticky; top: 24px; align-self: start; height: calc(100vh - 48px); aspect-ratio: 9 / 16; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .stage { position: relative; top: 0; height: auto; width: 100%; } }
</style>
</head>
<body>
<main>
  <aside>
    <h1>CULTO STORIES</h1>

    <section>
      <h2>Sfondo</h2>
      <label class="drop" id="bgDrop">Trascina qui il video di sfondo o clicca
        <input type="file" id="bgFile" accept="video/*" hidden>
      </label>
    </section>

    <section>
      <h2>Testi</h2>
      <label>Data evento <input type="date" id="pick"></label>
      <div class="row" style="--n:3">
        <label>Mese <input id="month"></label>
        <label>Giorno <input id="day"></label>
        <label>Apice <input id="sup"></label>
      </div>
      <label>Locale <input id="venue" value="MAISON 3"></label>
      <div class="row">
        <label>Giorno settimana <input id="weekday"></label>
        <label>Data <input id="date"></label>
      </div>
      <label>Riga in basso <input id="bottom" value="NOT AN ORDINARY CULTO"></label>
    </section>

    <section>
      <h2>Musica</h2>
      <div class="tabs" role="group">
        <button data-tab="search" aria-pressed="true">Cerca</button>
        <button data-tab="file" aria-pressed="false">Mio file</button>
        <button data-tab="none" aria-pressed="false">Nessuna</button>
      </div>
      <div id="tab-search" class="row" style="--n:1">
        <div class="row" style="grid-template-columns: 1fr auto auto">
          <input id="q" placeholder="Artista o titolo">
          <select id="source"><option value="yt">YouTube</option><option value="sc">SoundCloud</option></select>
          <button id="go">Cerca</button>
        </div>
        <ul id="results"></ul>
      </div>
      <label id="tab-file" hidden>File audio <input type="file" id="audioFile" accept="audio/*"></label>
      <div id="player" hidden class="row" style="--n:1">
        <div id="track"></div>
        <label>Inizio brano: <span id="startLabel">0:00</span>
          <input type="range" id="start" min="0" max="0" step="0.5" value="0">
        </label>
        <button id="preview">▶ Anteprima con musica</button>
      </div>
      <audio id="audio" preload="auto"></audio>
    </section>

    <button class="primary" id="export">Esporta MP4</button>
    <div id="status" role="status"></div>
  </aside>

  <div class="stage">
    <video id="bgVideo" muted loop playsinline></video>
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
